[package]
name = "ouveai-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["static"]
static = ["sherpa-onnx/static"]
shared = ["sherpa-onnx/shared"]

[dependencies]
bzip2 = "0.6.1"
log = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sherpa-onnx = { version = "2.0.1", default-features = false }
similar = { version = "3.2.1", default-features = false, features = ["std"] }
tar = "0.4.46"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
